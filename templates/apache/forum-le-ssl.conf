<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.example.org
    ServerAlias example.org example.com www.example.com
    ServerAdmin webmaster@example.org
    DocumentRoot /var/www/forum
    <Directory /var/www/forum>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/forum_error.log
    CustomLog ${APACHE_LOG_DIR}/forum_access.log combined
    # .com-Domain dauerhaft auf die Hauptadresse umleiten
    RewriteEngine on
    RewriteCond %{HTTP_HOST} ^(www\.)?example\.com$ [NC]
    RewriteRule ^ https://www.example.org%{REQUEST_URI} [END,NE,R=301]
Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/www.example.org/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/www.example.org/privkey.pem
</VirtualHost>
</IfModule>
