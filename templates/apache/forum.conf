<VirtualHost *:80>
    ServerName www.example.org
    ServerAlias example.org example.com www.example.com
    ServerAdmin webmaster@example.org
    DocumentRoot /var/www/forum
    <Directory /var/www/forum>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/forum_error.log
    CustomLog ${APACHE_LOG_DIR}/forum_access.log combined
RewriteEngine on
# .com-Domain dauerhaft auf die Hauptadresse umleiten (Let's-Encrypt-Pruefung ausgenommen)
RewriteCond %{HTTP_HOST} ^(www\.)?example\.com$ [NC]
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^ https://www.example.org%{REQUEST_URI} [END,NE,R=301]
RewriteCond %{SERVER_NAME} =www.example.org [OR]
RewriteCond %{SERVER_NAME} =example.org
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
