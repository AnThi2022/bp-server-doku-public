<VirtualHost *:80>
    ServerName www.bluemchenpfluecker.de
    ServerAlias bluemchenpfluecker.de bluemchenpfluecker.com www.bluemchenpfluecker.com
    ServerAdmin webmaster@bluemchenpfluecker.de
    DocumentRoot /var/www/forum
    <Directory /var/www/forum>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/forum_error.log
    CustomLog ${APACHE_LOG_DIR}/forum_access.log combined
RewriteEngine on
# .com-Domain dauerhaft auf die Hauptadresse umleiten (Let's-Encrypt-Pruefung ausgenommen)
RewriteCond %{HTTP_HOST} ^(www\.)?bluemchenpfluecker\.com$ [NC]
RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
RewriteRule ^ https://www.bluemchenpfluecker.de%{REQUEST_URI} [END,NE,R=301]
RewriteCond %{SERVER_NAME} =www.bluemchenpfluecker.de [OR]
RewriteCond %{SERVER_NAME} =bluemchenpfluecker.de
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
